<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Base</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body>
<nav class="navbar">
    <ul class="navbar-list">
        <li class="navbar-item navbar-left">
            <img class="navbar-img" src="{{ url_for('static', filename='images/cube.jpg') }}" alt="Cube image">
        </li>
        <li class="navbar-item"><a href="{{ url_for('index_route') }}">Homepage</a></li>
        <li class="navbar-item"><a href="{{ url_for('shop_route') }}">Cubeshop</a></li>
    </ul>
</nav>
<section class="content">
    <header>
        {% block header %}{% endblock %}
    </header>
    {% for message in get_flashed_messages() %}
    <div class="flash">{{ message }}</div>
    {% endfor %}
    {% block content %}{% endblock %}
</section>
{% include 'footer.html' %}
</body>
</html>
