server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }

    location /docs {
        proxy_pass http://fastapi:8000;
    }

    location /openapi.json {
        proxy_pass http://fastapi:8000;
    }

    location /api/ {
        proxy_pass http://fastapi:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
